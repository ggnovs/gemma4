<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemma 4 Workspace</title>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* CSS CSS VARIABLES & RESET */
    :root {
      --bg-primary: #0d1117;
      --bg-surface: #161b22;
      --bg-card: #21262d;
      --border-color: #30363d;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #2f81f7;
      --accent-hover: #58a6ff;
      --user-msg-bg: #1f6beb;
      --bot-msg-bg: #21262d;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh; /* Dynamic viewport height for mobile browsers */
      overflow: hidden;
    }

    /* HEADER */
    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .brand-badge {
      background: rgba(47, 129, 247, 0.15);
      color: var(--accent-hover);
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 20px;
      border: 1px solid rgba(47, 129, 247, 0.3);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #3fb950;
      border-radius: 50%;
    }

    /* MAIN CONTAINER & CHAT WINDOW */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      overflow: hidden;
      position: relative;
    }

    #chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    /* MESSAGE BUBBLES */
    .message {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
    }

    .message.bot {
      align-self: flex-start;
    }

    .message-sender {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      padding: 0 4px;
    }

    .message-content {
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.5;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .user .message-content {
      background-color: var(--user-msg-bg);
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .bot .message-content {
      background-color: var(--bot-msg-bg);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 2px;
    }

    /* INPUT FORM */
    .input-container {
      padding: 16px;
      background-color: var(--bg-primary);
      border-top: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    form {
      display: flex;
      gap: 10px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 6px 6px 6px 16px;
      transition: border-color 0.2s ease;
    }

    form:focus-within {
      border-color: var(--accent);
    }

    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    input[type="text"]::placeholder {
      color: var(--text-muted);
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:active {
      transform: scale(0.95);
    }

    button svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* MOBILE RESPONSIVE TWEAKS */
    @media (max-width: 600px) {
      header {
        padding: 10px 14px;
      }
      .brand {
        font-size: 1rem;
      }
      .message {
        max-width: 92%;
      }
      .input-container {
        padding: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand">
      <span>Gemma 4 App</span>
      <span class="brand-badge">26B MoE</span>
    </div>
    <div class="status-indicator">
      <div class="status-dot"></div>
      <span>Ready</span>
    </div>
  </header>

  <!-- MAIN CHAT AREA -->
  <main>
    <div id="chat-window">
      <!-- Initial Welcome Message -->
      <div class="message bot">
        <div class="message-sender">Gemma 4 Agent</div>
        <div class="message-content">
          Hello! I am powered by Gemma 4. How can I assist your business workflow today?
        </div>
      </div>
    </div>

    <!-- USER INPUT FORM -->
    <div class="input-container">
      <form id="chat-form">
        <input 
          type="text" 
          id="user-input" 
          placeholder="Ask a question or enter a task..." 
          autocomplete="off" 
          required 
        />
        <button type="submit" aria-label="Send message">
          <svg viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
          </svg>
        </button>
      </form>
    </div>
  </main>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const chatWindow = document.getElementById('chat-window');

    // Handle Form Submit
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const messageText = userInput.value.trim();
      if (!messageText) return;

      // 1. Render User Message
      appendMessage('user', 'You', messageText);
      userInput.value = '';

      // 2. Render Temporary Bot Loading Bubble
      const loadingBubble = appendMessage('bot', 'Gemma 4 Agent', 'Thinking...');

      try {
        // 3. Call your API backend or local Ollama instance
        // Replace this demo response with your actual fetch call later
        const botResponse = await getGemmaResponse(messageText);
        
        // Update loading bubble text with actual response
        loadingBubble.querySelector('.message-content').textContent = botResponse;
      } catch (error) {
        loadingBubble.querySelector('.message-content').textContent = '⚠️ Error communicating with Gemma 4.';
      }
    });

    // Append Message to UI
    function appendMessage(role, sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', role);

      msgDiv.innerHTML = `
        <div class="message-sender">${sender}</div>
        <div class="message-content">${escapeHTML(text)}</div>
      `;

      chatWindow.appendChild(msgDiv);
      chatWindow.scrollTop = chatWindow.scrollHeight;
      return msgDiv;
    }

    // Helper: Escape HTML to prevent basic XSS
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    // Simulated API call (Plug in your real backend endpoint here later)
    async function getGemmaResponse(prompt) {
      // Simulate network delay
      await new Promise(resolve => setTimeout(resolve, 1000));
      return `Received your input: "${prompt}". Connected to Gemma 4 endpoint!`;
    }
  </script>
</body>
</html>
