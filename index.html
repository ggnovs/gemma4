<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemma 4 AI Chat</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 100%;
      max-width: 600px;
      height: 80vh;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #1a73e8;
      color: white;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: 600;
      text-align: center;
    }

    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .user-message {
      align-self: flex-end;
      background-color: #1a73e8;
      color: white;
      border-bottom-right-radius: 2px;
    }

    .bot-message {
      align-self: flex-start;
      background-color: #e9ecef;
      color: #212529;
      border-bottom-left-radius: 2px;
    }

    .chat-input-area {
      display: flex;
      padding: 12px;
      background: #f8f9fa;
      border-top: 1px solid #dee2e6;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ced4da;
      border-radius: 20px;
      outline: none;
      font-size: 0.95rem;
    }

    input[type="text"]:focus {
      border-color: #1a73e8;
    }

    button {
      margin-left: 8px;
      padding: 10px 18px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      background-color: #1557b0;
    }

    button:disabled {
      background-color: #adb5bd;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">Gemma 4 Chat Assistant</div>
    <div class="chat-box" id="chatBox">
      <div class="message bot-message">System Online! How can I help you today?</div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="userInput" placeholder="Type a message..." onkeydown="handleKeyPress(event)">
      <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    // YOUR LIVE BACKEND URL
    const KAGGLE_API_URL = "https://uncrown-everglade-outflank.ngrok-free.dev/chat";

    async function sendMessage() {
      const inputField = document.getElementById("userInput");
      const chatBox = document.getElementById("chatBox");
      const sendBtn = document.getElementById("sendBtn");
      
      const prompt = inputField.value.trim();
      if (!prompt) return;

      // 1. Render User Message
      appendMessage(prompt, "user-message");
      inputField.value = "";
      
      // Disable input while waiting
      inputField.disabled = true;
      sendBtn.disabled = true;

      // 2. Render Loading Indicator
      const loadingDiv = appendMessage("Thinking...", "bot-message");

      try {
        // 3. Send POST Request to Kaggle/Ngrok
        const response = await fetch(KAGGLE_API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "ngrok-skip-browser-warning": "true" // Bypasses the Ngrok landing page warning
          },
          body: JSON.stringify({ prompt: prompt })
        });

        if (!response.ok) {
          throw new Error(`HTTP Error: ${response.status}`);
        }

        const data = await response.json();
        
        // 4. Update Loading Indicator with Model Response
        loadingDiv.textContent = data.response || "No response received.";

      } catch (error) {
        console.error("Fetch Error:", error);
        loadingDiv.textContent = "❌ Error connecting to backend. Check console for details.";
      } finally {
        // Re-enable controls
        inputField.disabled = false;
        sendBtn.disabled = false;
        inputField.focus();
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    function appendMessage(text, className) {
      const chatBox = document.getElementById("chatBox");
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${className}`;
      msgDiv.textContent = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }

    function handleKeyPress(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }
  </script>
</body>
</html>
