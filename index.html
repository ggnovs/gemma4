<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemma 4 AI Assistant</title>
  
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
  
  <!-- External Markdown Parser & Sanitizer for clean formatting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h2>Gemma 4 AI Assistant</h2>
    </div>
    
    <div class="chat-box" id="chatBox">
      <div class="message bot-message">System Online! How can I help you today?</div>
    </div>
    
    <div class="chat-input-area">
      <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <!-- Application Logic JS -->
  <script src="app.js"></script>
</body>
</html>
